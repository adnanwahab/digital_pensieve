<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mueseum Mode</title>
  <style>
    :root{
      --bg:#6d6d6d;
      --text:#e8e8e8;
      --dim:#cfcfcf;
      --shadow:rgba(0,0,0,.38);
      --gold-1:#f6df92;
      --gold-2:#d9b75a;
      --gold-3:#9d7422;
      --gold-4:#f3d983;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    body::before,
    body::after{
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    /* subtle cinematic grading to get closer to the reference style */
    body::before{
      background:
        radial-gradient(90% 65% at 50% 12%, rgba(255,228,167,.18), transparent 58%),
        radial-gradient(110% 85% at 50% 105%, rgba(0,0,0,.48), rgba(0,0,0,.62));
      mix-blend-mode:soft-light;
      opacity:.75;
    }

    body::after{
      background:
        linear-gradient(110deg, rgba(255,226,164,.12) 12%, transparent 26%),
        linear-gradient(72deg, rgba(255,214,138,.08) 14%, transparent 28%);
      opacity:.6;
    }

    #stage{position:fixed;inset:0;outline:none;z-index:2}

    .back{
      position:fixed;
      top:16px;
      left:16px;
      z-index:12;
      text-decoration:none;
      color:#ececec;
      font-size:13px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.25);
      padding:7px 10px;
      border-radius:8px;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .controls{
      position:fixed;
      left:20px;
      right:20px;
      bottom:16px;
      z-index:12;
      text-align:left;
      font-size:52px;
      letter-spacing:.01em;
      color:var(--dim);
      text-shadow:0 2px 7px var(--shadow);
      pointer-events:none;
      user-select:none;
      line-height:1.15;
      font-weight:500;
      transform-origin:left bottom;
      transform:scale(.34);
      white-space:nowrap;
    }

    .crosshair{
      position:fixed;
      left:50%;
      top:50%;
      width:18px;
      height:18px;
      transform:translate(-50%,-50%);
      pointer-events:none;
      opacity:0;
      transition:opacity .15s ease;
      z-index:12;
    }
    .crosshair::before,.crosshair::after{
      content:'';
      position:absolute;
      background:rgba(240,240,240,.9);
      box-shadow:0 0 6px rgba(0,0,0,.55);
    }
    .crosshair::before{left:8px;top:0;width:2px;height:18px}
    .crosshair::after{left:0;top:8px;width:18px;height:2px}
    body.locked .crosshair{opacity:.9}

    /* Museum geometry is scenery and should never capture pointer events */
    .wall,
    .floor,
    .ceiling,
    .frame,
    .frame::before{
      pointer-events:none !important;
    }

    .wall,
    .floor,
    .ceiling{
      transform-style:preserve-3d;
      will-change:transform;
    }

    /* Section walls should be visible from both directions. */
    .wall{
      backface-visibility:visible;
      -webkit-backface-visibility:visible;
    }

    /* Horizontal slabs are safer with hidden backfaces. */
    .floor,
    .ceiling{
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .frame{
      width:620px;
      height:400px;
      box-sizing:border-box;
      position:relative;
      padding:16px;
      background:linear-gradient(145deg,var(--gold-1) 0%,var(--gold-2) 28%,var(--gold-3) 52%,var(--gold-2) 76%,var(--gold-4) 100%);
      border:8px solid #7c5818;
      border-radius:6px;
      box-shadow:
        0 16px 28px rgba(0,0,0,.36),
        0 0 0 2px rgba(255,225,146,.34),
        inset 0 0 0 2px rgba(116,79,18,.65),
        inset 0 0 22px rgba(255,233,152,.2);
      /* No overflow:hidden here: on a 3D-transformed CSS3DObject, Chromium's
         overflow clip breaks hit testing into the iframe from most camera
         angles. The 16px padding already keeps the iframe inside the frame. */
    }

    .frame::before{
      content:'';
      position:absolute;
      inset:9px;
      border:2px solid rgba(255,236,170,.55);
      border-radius:3px;
      box-shadow:inset 0 0 0 1px rgba(107,72,15,.6), inset 0 0 18px rgba(71,46,10,.35);
    }

    /* Paintings are always interactive; the cursor is free whenever you're not looking around */
    .frame iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#090b16;
      box-shadow:0 0 0 1px rgba(255,236,180,.22);
      pointer-events:auto !important;
      transform:none;
      will-change:auto;
      backface-visibility:visible;
      -webkit-backface-visibility:visible;
    }

    .painting-label{
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:4px 10px;
      font-size:12px;
      letter-spacing:.03em;
      color:#efe5cb;
      background:rgba(22,18,12,.72);
      border:1px solid rgba(247,219,149,.45);
      border-radius:6px;
      text-shadow:0 1px 6px rgba(0,0,0,.75);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      pointer-events:none !important;
      user-select:none;
    }
    .ballot{
      position:fixed;
      right:16px;
      top:16px;
      z-index:12;
      width:min(360px,calc(100vw - 32px));
      max-height:calc(100vh - 32px);
      overflow:auto;
      background:rgba(12,10,10,.66);
      border:1px solid rgba(248,224,161,.45);
      border-radius:10px;
      padding:12px;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      box-shadow:0 12px 28px rgba(0,0,0,.36);
    }
    .ballot h2{
      margin:0 0 8px;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#f6e2af;
    }
    .ballot p{
      margin:0 0 10px;
      font-size:12px;
      color:#e9e2d4;
      line-height:1.45;
    }
    .ballot-row{display:flex;gap:8px;align-items:center}
    .ballot select,
    .ballot input,
    .ballot textarea,
    .ballot button{
      width:100%;
      border:1px solid rgba(255,230,171,.3);
      background:rgba(28,22,14,.6);
      color:#f4efe4;
      border-radius:7px;
      font:12px/1.35 Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      padding:8px;
    }
    .ballot button{
      width:auto;
      cursor:pointer;
      background:rgba(129,96,39,.7);
      font-weight:600;
      min-width:90px;
    }
    .ballot button:hover{background:rgba(149,111,47,.82)}
    .ballot-stats{font-size:12px;color:#ecdcb8;white-space:nowrap}
    .ballot textarea{resize:vertical;min-height:74px}
    .ballot-comments{
      list-style:none;
      margin:10px 0 0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:220px;
      overflow:auto;
    }
    .ballot-comments li{
      border:1px solid rgba(255,224,160,.22);
      background:rgba(18,14,8,.5);
      border-radius:8px;
      padding:8px;
    }
    .ballot-comments .meta{font-size:10px;letter-spacing:.02em;color:#d8c9a7;margin-bottom:4px}
    .ballot-comments .text{font-size:12px;line-height:1.45;color:#f4efe4;white-space:pre-wrap;word-break:break-word}
    .ballot-empty{font-size:11px;color:#cfbea0}
    .ballot-status{min-height:16px;font-size:11px;color:#f1dfb3;margin-top:6px}

    @media (max-width:900px){
      .ballot{top:62px;max-height:calc(100vh - 78px)}
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Mueseum mode 3D gallery" tabindex="0"></div>
  <a class="back" href="/">← Back to pensieve</a>
  <div class="controls" id="controlsText">WASD move · Shift sprint · Space jump · hold right-click (or drag empty space) to look · click paintings to interact</div>
  <div class="crosshair" aria-hidden="true"></div>

  <aside class="ballot" aria-label="Open ballot for museum paintings">
    <h2>Open Ballot</h2>
    <p>Vote and comment on each artwork.</p>
    <select id="ballotArtwork" aria-label="Select artwork"></select>
    <div class="ballot-row" style="margin-top:8px;">
      <button id="ballotVote" type="button">Vote</button>
      <span class="ballot-stats" id="ballotVotes">Votes: 0</span>
    </div>
    <form id="ballotForm" style="margin-top:10px;">
      <input id="ballotName" type="text" maxlength="80" placeholder="Your name (optional)" />
      <textarea id="ballotComment" maxlength="600" required placeholder="Share your thoughts on this artwork"></textarea>
      <button type="submit">Post comment</button>
    </form>
    <div id="ballotStatus" class="ballot-status" aria-live="polite"></div>
    <ul id="ballotComments" class="ballot-comments"></ul>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/renderers/CSS3DRenderer.js';

    const stage = document.getElementById('stage');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 9000);

    const renderer = new CSS3DRenderer();
    renderer.setSize(innerWidth, innerHeight);
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.touchAction = 'none';
    renderer.domElement.style.pointerEvents = 'auto';
    stage.appendChild(renderer.domElement);

    function cssPanel(className, w, h, cssText=''){
      const el = document.createElement('div');
      el.className = className;
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.cssText += cssText;

      if (className === 'wall' || className === 'floor' || className === 'ceiling') {
        el.style.pointerEvents = 'none';
      }

      return el;
    }

    const visualizationFiles = await loadVisualizationFiles();

    // Multi-room shell
    const PAINTINGS_PER_WALL = 4;
    const WALLS_PER_ROOM = 2;
    const ROOM_COUNT = Math.max(1, Math.ceil(visualizationFiles.length / (PAINTINGS_PER_WALL * WALLS_PER_ROOM)));
    const ROOM_WIDTH = 4300;
    const ROOM_DEPTH = 2200;
    const ROOM_FRONT_Z = 900;
    const ROOM_SIDE_X = 2140;
    const DOOR_GAP = 1100;
    const WALL_HEIGHT = 2600;

    // Doorway opening in section separators (so sections stay connected).
    const FLOOR_Y = -260;
    const DOOR_CLEAR_HEIGHT = 860;

    // Avoid coplanar/overlapping shell surfaces between adjacent rooms.
    // CSS3D has no depth buffer, so overlapping planes can create cutout/flicker artifacts.
    const ROOM_SHELL_WIDTH = ROOM_WIDTH;
    const ROOM_SHELL_DEPTH = ROOM_DEPTH - 120;

    const WALL_TEXTURE_URL = '/visualizations/Seamless%20Warm%20Plaster%20Wall%20Texture.png';

    function wallMaterial(bg){
      return `
        background:
          linear-gradient(180deg, rgba(255,245,214,.10) 0%, rgba(0,0,0,.20) 100%),
          url("${WALL_TEXTURE_URL}"),
          ${bg};
        background-size:
          100% 100%,
          880px 880px,
          auto;
        background-repeat:
          no-repeat,
          repeat,
          no-repeat;
        background-position:
          center,
          center,
          center;
        box-shadow:
          inset 0 0 0 2px rgba(0,0,0,.34),
          inset 0 140px 220px rgba(255,221,167,.10),
          inset 0 -220px 260px rgba(0,0,0,.24);
      `;
    }

    const roomMeta = [];

    for (let i = 0; i < ROOM_COUNT; i++){
      const frontZ = ROOM_FRONT_Z - i * ROOM_DEPTH;
      const backZ = frontZ - ROOM_DEPTH;
      const centerZ = (frontZ + backZ) / 2;
      roomMeta.push({ frontZ, backZ, centerZ });

      const sideWallL = new CSS3DObject(cssPanel('wall', ROOM_SHELL_DEPTH, WALL_HEIGHT, wallMaterial('#3f3b35')));
      sideWallL.position.set(-ROOM_SIDE_X, 310, centerZ);
      sideWallL.rotation.y = Math.PI / 2;
      scene.add(sideWallL);

      const sideWallR = new CSS3DObject(cssPanel('wall', ROOM_SHELL_DEPTH, WALL_HEIGHT, wallMaterial('#443f38')));
      sideWallR.position.set(ROOM_SIDE_X, 310, centerZ);
      sideWallR.rotation.y = -Math.PI / 2;
      scene.add(sideWallR);


      if (i === ROOM_COUNT - 1){
        const backWall = new CSS3DObject(cssPanel('wall', ROOM_SHELL_WIDTH, WALL_HEIGHT, wallMaterial('#4b463f')));
        backWall.position.set(0, 310, backZ);
        scene.add(backWall);
      } else {
        const segW = (ROOM_SHELL_WIDTH - DOOR_GAP) / 2;
        const leftDivider = new CSS3DObject(cssPanel('wall', segW, WALL_HEIGHT, wallMaterial('#4a453f')));
        leftDivider.position.set(-(DOOR_GAP / 2 + segW / 2), 310, backZ);
        scene.add(leftDivider);

        const rightDivider = new CSS3DObject(cssPanel('wall', segW, WALL_HEIGHT, wallMaterial('#4a453f')));
        rightDivider.position.set(DOOR_GAP / 2 + segW / 2, 310, backZ);
        scene.add(rightDivider);

        // Add a top lintel so each room boundary reads as a true section wall.
        const wallTopY = 310 + WALL_HEIGHT / 2;
        const doorwayTopY = FLOOR_Y + DOOR_CLEAR_HEIGHT;
        const lintelHeight = Math.max(120, wallTopY - doorwayTopY);
        const lintelY = wallTopY - lintelHeight / 2;
        const topDivider = new CSS3DObject(cssPanel('wall', DOOR_GAP, lintelHeight, wallMaterial('#49443d')));
        topDivider.position.set(0, lintelY, backZ);
        scene.add(topDivider);
      }
    }

    const galleryFrontZ = ROOM_FRONT_Z + 420;
    const galleryBackZ = roomMeta[roomMeta.length - 1].backZ - 260;
    const galleryDepth = galleryFrontZ - galleryBackZ;
    const galleryCenterZ = (galleryFrontZ + galleryBackZ) / 2;

    const floor = new CSS3DObject(cssPanel('floor', ROOM_SHELL_WIDTH, galleryDepth,
      'background:' +
      'linear-gradient(90deg, rgba(0,0,0,.18) 2px, transparent 2px) 0 0 / 700px 700px,' +
      'linear-gradient(0deg, rgba(0,0,0,.16) 2px, transparent 2px) 0 0 / 700px 700px,' +
      '#4a4d50;'));
    floor.position.set(0, FLOOR_Y, galleryCenterZ);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const ceiling = new CSS3DObject(cssPanel('ceiling', ROOM_SHELL_WIDTH, galleryDepth,
      'background:' +
      'radial-gradient(ellipse at 50% 10%, rgba(255,231,178,.10), transparent 52%),' +
      'repeating-linear-gradient(90deg, rgba(33,31,29,.95) 0 150px, rgba(57,54,50,.95) 150px 220px),' +
      '#2f2c2a;'));
    ceiling.position.set(0, 920, galleryCenterZ);
    ceiling.rotation.x = Math.PI / 2;
    scene.add(ceiling);

    async function loadVisualizationFiles(){
      try {
        const res = await fetch('/api/visualizations', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        if (Array.isArray(payload?.files) && payload.files.length) return payload.files;
      } catch (err) {
        console.warn('Failed to load /api/visualizations, using fallback list.', err);
      }

      return [
        'Giza in Particles.html',
        'Navy Orbit Field.html',
        'Neon Cybernetic Queen Portrait.png',
        'Ocean Jump.html',
        'Skyfall.html',
        'The Thinning Room.html',
        'Thought Exchange.html',
        'Vision Sketchbook.html',
        'brain-forest-fire.html',
        'distant_particle_heart_purple.html',
        'energy-sphere-impact.html',
        'energy_sphere_million_particle_impact.html',
        'globe-painting.html',
        'globe_three_phase_energy_cycle_fixed.html',
        'glowing_wheel_of_becoming_threejs.html',
        'memory_basin_swirl.html',
        'neon_honey_bear_animated.html',
        'neuro_probe_memory_voyage_3d.html',
        'particle-triangle-standalone.html',
        'particle_city_absorbed_into_light_bow.html',
        'pensieve_launch_people_by_day_grid.html',
        'projector-curtain.html',
        'rainbow-archons.html',
        'rainbow_particle_yoga_silhouette.html',
        'synchronized-swimming.html',
        'tapestry_weaving_from_threads.html',
        'thousand_minds_shared_picture.html'
      ];
    }

    const paintings = visualizationFiles.map((file, i) => ({
      artwork: file,
      src: encodeURI(`/visualizations/${file}`),
      title: `Mueseum painting ${i + 1}: ${file}`
    }));

    const ballotArtworkEl = document.getElementById('ballotArtwork');
    const ballotVoteEl = document.getElementById('ballotVote');
    const ballotVotesEl = document.getElementById('ballotVotes');
    const ballotFormEl = document.getElementById('ballotForm');
    const ballotNameEl = document.getElementById('ballotName');
    const ballotCommentEl = document.getElementById('ballotComment');
    const ballotCommentsEl = document.getElementById('ballotComments');
    const ballotStatusEl = document.getElementById('ballotStatus');

    let activeBallotArtwork = visualizationFiles[0] || '';

    function setBallotStatus(message){
      if (!ballotStatusEl) return;
      ballotStatusEl.textContent = message || '';
    }

    function formatBallotDate(iso){
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderBallotEntry(entry){
      if (!ballotVotesEl || !ballotCommentsEl) return;
      const votes = Number(entry?.votes || 0);
      const comments = Array.isArray(entry?.comments) ? entry.comments : [];

      ballotVotesEl.textContent = `Votes: ${votes}`;
      ballotCommentsEl.innerHTML = '';

      if (!comments.length){
        const li = document.createElement('li');
        li.className = 'ballot-empty';
        li.textContent = 'No comments yet. Be the first to leave one.';
        ballotCommentsEl.appendChild(li);
        return;
      }

      comments
        .slice()
        .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))
        .forEach(comment => {
          const li = document.createElement('li');

          const meta = document.createElement('div');
          meta.className = 'meta';
          const author = (comment.author || 'Anonymous').trim() || 'Anonymous';
          const stamp = formatBallotDate(comment.createdAt);
          meta.textContent = stamp ? `${author} · ${stamp}` : author;

          const text = document.createElement('div');
          text.className = 'text';
          text.textContent = comment.text || '';

          li.appendChild(meta);
          li.appendChild(text);
          ballotCommentsEl.appendChild(li);
        });
    }

    async function loadBallotEntry(artwork){
      if (!artwork) {
        renderBallotEntry({ votes: 0, comments: [] });
        return;
      }

      try {
        const url = `/api/ballot?artwork=${encodeURIComponent(artwork)}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        renderBallotEntry(payload?.entry || { votes: 0, comments: [] });
      } catch (err) {
        console.warn('Failed to load ballot entry.', err);
        setBallotStatus('Could not load votes/comments right now.');
      }
    }

    async function submitBallotVote(){
      if (!activeBallotArtwork) return;
      setBallotStatus('Submitting vote…');
      try {
        const res = await fetch('/api/ballot/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ artwork: activeBallotArtwork })
        });
        const payload = await res.json();
        if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);
        renderBallotEntry(payload?.entry || { votes: 0, comments: [] });
        setBallotStatus('Vote recorded.');
      } catch (err) {
        console.warn('Failed to submit vote.', err);
        setBallotStatus('Could not submit vote. Please try again.');
      }
    }

    async function submitBallotComment(){
      if (!activeBallotArtwork || !ballotCommentEl) return;
      const text = ballotCommentEl.value.trim();
      if (!text) {
        setBallotStatus('Please enter a comment before posting.');
        return;
      }

      setBallotStatus('Posting comment…');
      try {
        const res = await fetch('/api/ballot/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            artwork: activeBallotArtwork,
            author: ballotNameEl?.value || '',
            text
          })
        });
        const payload = await res.json();
        if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);
        renderBallotEntry(payload?.entry || { votes: 0, comments: [] });
        ballotCommentEl.value = '';
        setBallotStatus('Comment posted.');
      } catch (err) {
        console.warn('Failed to submit comment.', err);
        setBallotStatus('Could not post comment. Please try again.');
      }
    }

    function initBallot(){
      if (!ballotArtworkEl) return;

      const options = visualizationFiles.map((file, index) => {
        const option = document.createElement('option');
        option.value = file;
        option.textContent = `${index + 1}. ${file}`;
        return option;
      });
      ballotArtworkEl.replaceChildren(...options);

      if (!activeBallotArtwork && visualizationFiles.length) {
        activeBallotArtwork = visualizationFiles[0];
      }
      ballotArtworkEl.value = activeBallotArtwork;

      ballotArtworkEl.addEventListener('change', () => {
        activeBallotArtwork = ballotArtworkEl.value;
        loadBallotEntry(activeBallotArtwork);
      });

      ballotVoteEl?.addEventListener('click', submitBallotVote);

      ballotFormEl?.addEventListener('submit', (event) => {
        event.preventDefault();
        submitBallotComment();
      });

      loadBallotEntry(activeBallotArtwork);
    }

    initBallot();

    const FRAME_W = 680;
    const FRAME_H = 430;
    const SURFACE_SPAN = ROOM_DEPTH - 840;

    const paintingSurfaces = roomMeta.flatMap(room => ([
      { primary:'z', fixed:-2090, ry: Math.PI / 2, center: room.centerZ },
      { primary:'z', fixed: 2090, ry:-Math.PI / 2, center: room.centerZ }
    ]));

    const rowYs = [660, 150];
    const labelRowYs = [410, 390]; // central gap between top and bottom rows
    const colOffsets = [-SURFACE_SPAN * 0.30, SURFACE_SPAN * 0.30];

    const slots = [];
    paintingSurfaces.forEach(surface => {
      // 4 paintings per wall: 2 columns x 2 rows
      rowYs.forEach((rowY, rowIdx) => {
        colOffsets.forEach(offset => {
          const v = surface.center + offset;
          if (surface.primary === 'x') {
            slots.push({ x:v, y:rowY, z:surface.fixed, ry:surface.ry, labelY:labelRowYs[rowIdx] });
          } else {
            slots.push({ x:surface.fixed, y:rowY, z:v, ry:surface.ry, labelY:labelRowYs[rowIdx] });
          }
        });
      });
    });

    // ---------- Shared input state (used by both the gallery and the iframes) ----------
    camera.rotation.order = 'YXZ';
    const keys = {};
    const eyeHeight = 200;
    const pos = new THREE.Vector3(0, eyeHeight, 980);
    const vel = new THREE.Vector3();
    let yaw = 0;
    let pitch = -0.06;
    let locked = false;
    let grounded = true;
    let bobT = 0;
    let lookButton = -1; // mouse button currently held for look, -1 = none

    const MOUSE_SENS = 0.0022;
    const PITCH_MIN = -1.18;
    const PITCH_MAX = 0.78;
    const GRAVITY = 1900;
    const JUMP_V = 700;
    const WALK_SPEED = 2630;
    const SPRINT_SPEED = 4230;
    const GROUND_ACCEL = 14;
    const AIR_ACCEL = 4;
    const GROUND_FRICTION = 9;
    const AIR_DRAG = 0.25;
    const MOVE_UP = new THREE.Vector3(0, 1, 0);
    const moveLocalTmp = new THREE.Vector3();

    const MOVE_CODES = new Set([
      'KeyW','KeyA','KeyS','KeyD',
      'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
      'ShiftLeft','ShiftRight','Space'
    ]);

    function isTypingTarget(t){
      return !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''));
    }

    function onMoveKeyDown(e){
      if (!MOVE_CODES.has(e.code) || isTypingTarget(e.target)) return;
      keys[e.code] = true;
      e.preventDefault();
      if (e.code === 'Space' && !e.repeat && grounded){
        vel.y = JUMP_V;
        grounded = false;
      }
    }

    function onMoveKeyUp(e){
      if (MOVE_CODES.has(e.code)) keys[e.code] = false;
    }

    function clearKeys(){
      for (const code of MOVE_CODES) keys[code] = false;
    }

    function requestLock(){
      const p = renderer.domElement.requestPointerLock?.();
      if (p && typeof p.catch === 'function') p.catch(() => { lookButton = -1; });
    }

    function startLook(button){
      if (locked) return;
      lookButton = button;
      requestLock();
    }

    function endLook(button){
      if (button !== lookButton) return;
      lookButton = -1;
      if (document.pointerLockElement) document.exitPointerLock();
    }

    // Wire an iframe so movement keys and right-click look keep working while it has focus.
    // Works because the visualizations are same-origin; cross-origin pages are skipped silently.
    function hookIframe(iframe){
      iframe.addEventListener('load', () => {
        let win, doc;
        try {
          win = iframe.contentWindow;
          doc = win.document;
        } catch { return; }
        if (!win || !doc || win.__museumHooked) return;
        win.__museumHooked = true;

        win.addEventListener('keydown', onMoveKeyDown, true);
        win.addEventListener('keyup', onMoveKeyUp, true);
        doc.addEventListener('mousedown', e => {
          if (e.button === 2){ e.preventDefault(); startLook(2); }
        }, true);
        doc.addEventListener('mouseup', e => endLook(e.button), true);
        doc.addEventListener('contextmenu', e => e.preventDefault(), true);
      });
    }

    // ---------- Paintings ----------
    const iframeEntries = [];
    const preloadFrustum = new THREE.Frustum();
    const preloadProjectionMatrix = new THREE.Matrix4();
    const preloadWorldPos = new THREE.Vector3();
    const preloadBoundsSphere = new THREE.Sphere(new THREE.Vector3(), 430);
    const PRELOAD_CHECK_MS = 100;
    let nextPreloadCheck = 0;

    function setIframeActive(entry, active){
      if (entry.active === active) return;

      const iframe = entry.iframe;
      const src = iframe.dataset.src;

      if (active) {
        if (!src) return;
        iframe.src = src;
        iframe.dataset.active = '1';
      } else {
        iframe.src = 'about:blank';
        iframe.dataset.active = '0';
      }

      entry.active = active;
    }

    function updateIframePreload(now){
      if (now < nextPreloadCheck) return;
      nextPreloadCheck = now + PRELOAD_CHECK_MS;

      camera.updateMatrixWorld(true);
      camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
      preloadProjectionMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      preloadFrustum.setFromProjectionMatrix(preloadProjectionMatrix);

      for (let i = 0; i < iframeEntries.length; i++){
        const entry = iframeEntries[i];

        entry.object.getWorldPosition(preloadWorldPos);
        preloadBoundsSphere.center.copy(preloadWorldPos);

        const inFrustum = preloadFrustum.intersectsSphere(preloadBoundsSphere);
        setIframeActive(entry, inFrustum);
      }
    }

    paintings.forEach((painting, i) => {
      const frameEl = cssPanel('frame', FRAME_W, FRAME_H);
      const iframe = document.createElement('iframe');
      iframe.dataset.src = painting.src;
      iframe.dataset.active = '0';
      iframe.dataset.artwork = painting.artwork;
      iframe.title = painting.title || `Mueseum painting ${i + 1}`;
      if (painting.allow) iframe.allow = painting.allow;
      if (painting.referrerPolicy) iframe.referrerPolicy = painting.referrerPolicy;
      if (painting.allowFullscreen) iframe.allowFullscreen = true;
      hookIframe(iframe);
      iframe.addEventListener('pointerdown', () => {
        if (!painting.artwork || !ballotArtworkEl) return;
        if (ballotArtworkEl.value !== painting.artwork) {
          ballotArtworkEl.value = painting.artwork;
          activeBallotArtwork = painting.artwork;
          loadBallotEntry(activeBallotArtwork);
        }
      });
      frameEl.appendChild(iframe);

      const frame = new CSS3DObject(frameEl);
      const slot = slots[i] || slots[slots.length - 1];
      frame.position.set(slot.x, slot.y, slot.z);
      frame.rotation.y = slot.ry;
      scene.add(frame);

      const labelEl = cssPanel('painting-label', 330, 30);
      const artworkName = decodeURI(painting.artwork || '');
      const sourceName = artworkName
        .replace(/\/index\.html$/i, '')
        .replace(/\.[^.]+$/, '')
        .split('/')
        .filter(Boolean)
        .join(' / ');
      labelEl.textContent = `${i + 1}. ${sourceName || 'untitled'}`;
      const labelObj = new CSS3DObject(labelEl);
      labelObj.position.set(slot.x, slot.labelY ?? 400, slot.z);
      labelObj.rotation.y = slot.ry;
      scene.add(labelObj);

      iframeEntries.push({ el: frameEl, iframe, object: frame, active: false });
    });

    // ---------- Gallery input ----------
    // Mousedown on empty scenery (walls/floor are pointer-events:none, so it lands on the renderer).
    // Iframe clicks never reach here, so left-click on a painting stays an interaction.
    renderer.domElement.addEventListener('mousedown', e => {
      if (e.button !== 0 && e.button !== 2) return;
      if (e.target.closest?.('iframe, a, button, input, textarea, select, option')) return;
      e.preventDefault();

      // Left-drag on empty space also takes keyboard focus back from any painting.
      if (e.button === 0){
        const active = document.activeElement;
        if (active && active.tagName === 'IFRAME') active.blur();
        stage.focus({ preventScroll: true });
      }
      startLook(e.button);
    });

    // While locked, mouse events go to the locked element and bubble to document.
    document.addEventListener('mouseup', e => endLook(e.button));
    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === renderer.domElement;
      document.body.classList.toggle('locked', locked);
      // Button was released before the lock was granted: let go immediately.
      if (locked && lookButton === -1) document.exitPointerLock();
      // Lock ended some other way (e.g. Esc): forget the held button.
      if (!locked) lookButton = -1;
    });

    document.addEventListener('mousemove', e => {
      if (!locked) return;
      yaw -= e.movementX * MOUSE_SENS;
      pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch - e.movementY * (MOUSE_SENS * 0.9)));
    });

    addEventListener('keydown', onMoveKeyDown);
    addEventListener('keyup', onMoveKeyUp);

    // Drop held keys when the whole page loses focus (alt-tab), but not when focus
    // just moves into one of our iframes.
    addEventListener('blur', () => {
      setTimeout(() => { if (!document.hasFocus()) clearKeys(); }, 0);
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearKeys(); });

    // ---------- Movement ----------
    function applyFriction(dt, amount){
      const speed = Math.hypot(vel.x, vel.z);
      if (speed <= 0.0001) return;
      const drop = speed * amount * dt;
      const next = Math.max(0, speed - drop);
      const scale = next / speed;
      vel.x *= scale;
      vel.z *= scale;
    }

    function accelerate(wishX, wishZ, wishSpeed, accel, dt){
      if (wishSpeed <= 0) return;
      const wishDirX = wishX / wishSpeed;
      const wishDirZ = wishZ / wishSpeed;
      const currentSpeed = vel.x * wishDirX + vel.z * wishDirZ;
      const addSpeed = wishSpeed - currentSpeed;
      if (addSpeed <= 0) return;
      const accelSpeed = Math.min(addSpeed, accel * wishSpeed * dt);
      vel.x += wishDirX * accelSpeed;
      vel.z += wishDirZ * accelSpeed;
    }

    function updateWalk(dt){
      let mx = 0;
      let mz = 0;

      if (keys.KeyA || keys.ArrowLeft) mx -= 1;
      if (keys.KeyD || keys.ArrowRight) mx += 1;
      if (keys.KeyW || keys.ArrowUp) mz += 1;
      if (keys.KeyS || keys.ArrowDown) mz -= 1;

      const moving = mx !== 0 || mz !== 0;
      const len = Math.hypot(mx, mz);
      if (len > 1){
        mx /= len;
        mz /= len;
      }

      const sprinting = keys.ShiftLeft || keys.ShiftRight;
      const moveSpeed = sprinting ? SPRINT_SPEED : WALK_SPEED;
      moveLocalTmp.set(mx, 0, -mz).applyAxisAngle(MOVE_UP, yaw);
      const wishX = moveLocalTmp.x * moveSpeed;
      const wishZ = moveLocalTmp.z * moveSpeed;
      const wishSpeed = Math.hypot(wishX, wishZ);

      if (grounded){
        applyFriction(dt, moving ? GROUND_FRICTION : GROUND_FRICTION * 2.2);
        accelerate(wishX, wishZ, wishSpeed, GROUND_ACCEL, dt);
      } else {
        applyFriction(dt, AIR_DRAG);
        accelerate(wishX, wishZ, wishSpeed, AIR_ACCEL, dt);
      }

      vel.y -= GRAVITY * dt;

      pos.x += vel.x * dt;
      pos.y += vel.y * dt;
      pos.z += vel.z * dt;

      if (pos.y <= eyeHeight){
        pos.y = eyeHeight;
        vel.y = 0;
        grounded = true;
      }

      const minZ = roomMeta[roomMeta.length - 1].backZ + 220;
      const maxZ = ROOM_FRONT_Z + 280;
      pos.x = Math.max(-1880, Math.min(1880, pos.x));
      pos.z = Math.max(minZ, Math.min(maxZ, pos.z));

      const planar = Math.hypot(vel.x, vel.z);
      if (grounded && planar > 40 && moving) bobT += dt * (sprinting ? 15 : 10);
      const bob = grounded ? Math.sin(bobT) * Math.min(6, planar * 0.008) : 0;

      const targetFov = sprinting && planar > 140 ? 55 : 50;
      camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
      camera.updateProjectionMatrix();

      camera.position.set(pos.x, pos.y + bob, pos.z);
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function resize(){
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    let last = performance.now();
    function frame(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      updateWalk(dt);
      updateIframePreload(now);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    camera.position.copy(pos);
    camera.rotation.set(pitch, yaw, 0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
