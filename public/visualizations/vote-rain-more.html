<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vote Rain — Planetary Voting Visualization</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04060d;color:#e9f4ff;font-family:Inter,system-ui,sans-serif}
    #app{position:fixed;inset:0}
    canvas{display:block}
    .hud{
      position:fixed;left:18px;top:18px;z-index:5;
      padding:14px 16px;border:1px solid rgba(255,255,255,.12);
      border-radius:16px;background:rgba(5,8,18,.48);
      backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.28);
      max-width:330px
    }
    h1{font-size:18px;margin:0 0 6px;letter-spacing:.03em}
    p{font-size:12px;line-height:1.45;opacity:.72;margin:0 0 10px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    button{
      border:1px solid rgba(255,255,255,.14);color:white;background:rgba(255,255,255,.06);
      padding:8px 10px;border-radius:999px;cursor:pointer
    }
    button:hover{background:rgba(255,255,255,.12)}
    #legend{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .choice{font-size:11px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.05);text-align:center}
    .count{font-variant-numeric:tabular-nums;font-weight:700}
    .footer{position:fixed;right:16px;bottom:14px;font-size:11px;opacity:.45}
  </style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <h1>Vote Rain</h1>
  <p>Eight billion votes become a planetary weather system: falling beams, orbital vote traffic, relay satellites, lightning consensus links, shockwaves, and tornado columns growing over each choice.</p>
  <div class="row">
    <button id="burst">Vote burst</button>
    <button id="storm">Vote storm</button>
    <button id="pulse">Global pulse</button>
    <button id="rebalance">Rebalance</button>
    <button id="reset">Reset</button>
  </div>
  <div style="margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.5">
    planetary consensus network · live
  </div>
  <div id="legend">
    <div class="choice">Aurora<br><span class="count" id="aCount">0</span></div>
    <div class="choice">Solar<br><span class="count" id="bCount">0</span></div>
    <div class="choice">Ocean<br><span class="count" id="cCount">0</span></div>
  </div>
</div>
<div class="footer">Drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const app = document.getElementById("app");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060d, 0.018);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 200);
camera.position.set(0, 8, 22);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,1.5,0);
controls.minDistance = 11;
controls.maxDistance = 42;

scene.add(new THREE.AmbientLight(0x64748b, .55));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(5,12,8); scene.add(key);
const rim = new THREE.PointLight(0x4f8cff, 22, 35, 2);
rim.position.set(-8,6,-7); scene.add(rim);

// star field
{
  const n=2400, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=50+Math.random()*70, th=Math.random()*Math.PI*2, u=Math.random()*2-1;
    const s=Math.sqrt(1-u*u);
    p[i*3]=r*s*Math.cos(th); p[i*3+1]=r*u; p[i*3+2]=r*s*Math.sin(th);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0xaecbff,size:.055,transparent:true,opacity:.55,depthWrite:false});
  scene.add(new THREE.Points(g,m));
}

// Earth
const globe = new THREE.Group(); globe.position.y=-1.5; scene.add(globe);
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(3.15,96,96),
  new THREE.MeshStandardMaterial({
    color:0x071b2c, roughness:.45, metalness:.12,
    emissive:0x03111c, emissiveIntensity:.8
  })
);
globe.add(earth);

const wire = new THREE.Mesh(
  new THREE.SphereGeometry(3.19,40,24),
  new THREE.MeshBasicMaterial({color:0x4ecbff,wireframe:true,transparent:true,opacity:.075,depthWrite:false})
);
globe.add(wire);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(3.43,64,64),
  new THREE.MeshBasicMaterial({color:0x43bfff,transparent:true,opacity:.055,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})
);
globe.add(atmosphere);

// luminous planetary pulse shell
const pulseShell = new THREE.Mesh(
  new THREE.SphereGeometry(3.62,64,64),
  new THREE.MeshBasicMaterial({
    color:0xb9efff, transparent:true, opacity:.025,
    blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false
  })
);
globe.add(pulseShell);

// orbital infrastructure rings
const orbitalRings = new THREE.Group();
globe.add(orbitalRings);
[
  [4.15, 0.012, 0.24, 0.2],
  [4.55, 0.009, -0.62, 1.0],
  [5.00, 0.007, 0.88, -0.65],
].forEach(([r,t,rx,rz],i)=>{
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r,t,8,180),
    new THREE.MeshBasicMaterial({
      color:[0x79ffb7,0xffc34d,0x62a8ff][i],
      transparent:true, opacity:.23, blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  ring.rotation.set(rx,0,rz);
  orbitalRings.add(ring);
});

// small satellites / relay nodes
const relayGroup = new THREE.Group();
globe.add(relayGroup);
for(let i=0;i<10;i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(.12,.07,.2),
    new THREE.MeshStandardMaterial({color:0xd7efff,metalness:.8,roughness:.2,emissive:0x183040,emissiveIntensity:.6})
  );
  const panelMat = new THREE.MeshBasicMaterial({color:0x5aa9ff,transparent:true,opacity:.75});
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(.28,.018,.09),panelMat);
  const p2 = p1.clone(); p1.position.x=-.22; p2.position.x=.22;
  g.add(body,p1,p2);
  g.userData={a:Math.random()*Math.PI*2,r:4.3+Math.random()*.75,s:.08+Math.random()*.08,tilt:(Math.random()-.5)*1.4};
  relayGroup.add(g);
}

// faint equatorial aurora band
const auroraBand = new THREE.Mesh(
  new THREE.TorusGeometry(3.5,.055,12,200),
  new THREE.MeshBasicMaterial({color:0x65ffd0,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false})
);
auroraBand.rotation.x=Math.PI/2+.22;
globe.add(auroraBand);

// fake city lights
{
  const n=1500, pos=[];
  for(let i=0;i<n;i++){
    const y=Math.random()*2-1, th=Math.random()*Math.PI*2;
    const r=Math.sqrt(1-y*y), R=3.18;
    // uneven probability to suggest continents
    const signal=Math.sin(th*3.1)+Math.sin(th*7+y*4)+Math.cos(y*8);
    if(signal < -.55 && Math.random()>.22) continue;
    pos.push(R*r*Math.cos(th), R*y, R*r*Math.sin(th));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  globe.add(new THREE.Points(g,new THREE.PointsMaterial({
    color:0x8feaff,size:.035,transparent:true,opacity:.65,blending:THREE.AdditiveBlending,depthWrite:false
  })));
}

// attractors around the world
const colors=[0x79ffb7,0xffc34d,0x62a8ff];
const cssColors=["#79ffb7","#ffc34d","#62a8ff"];
const attractors=[
  new THREE.Vector3(-5.4,1.2,0.5),
  new THREE.Vector3(0,2.0,-5.5),
  new THREE.Vector3(5.3,1.1,0.8)
];

const labels = ["Aurora","Solar","Ocean"];
const labelSprites=[];

function makeLabel(text,color){
  const c=document.createElement("canvas"); c.width=512;c.height=128;
  const x=c.getContext("2d");
  x.clearRect(0,0,512,128);
  x.font="700 48px Inter,Arial"; x.textAlign="center"; x.textBaseline="middle";
  x.shadowBlur=24; x.shadowColor=color; x.fillStyle="white"; x.fillText(text,256,64);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(3.2,.8,1); return s;
}
attractors.forEach((p,i)=>{
  const orb=new THREE.Mesh(
    new THREE.SphereGeometry(.23,24,24),
    new THREE.MeshBasicMaterial({color:colors[i]})
  );
  orb.position.copy(p); scene.add(orb);
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.48,.025,10,64),
    new THREE.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.75})
  );
  ring.position.copy(p); ring.rotation.x=Math.PI/2; scene.add(ring);
  const s=makeLabel(labels[i],cssColors[i]); s.position.copy(p).add(new THREE.Vector3(0,-.85,0)); scene.add(s); labelSprites.push(s);
});

// choice monuments: glowing pylons + concentric machinery
const monuments=[];
attractors.forEach((p,i)=>{
  const group=new THREE.Group();
  group.position.copy(p);
  const pillar=new THREE.Mesh(
    new THREE.CylinderGeometry(.08,.22,1.45,14),
    new THREE.MeshStandardMaterial({
      color:0x111722,metalness:.75,roughness:.22,
      emissive:colors[i],emissiveIntensity:.35
    })
  );
  pillar.position.y=-.62;
  group.add(pillar);
  for(let r=0;r<4;r++){
    const tor=new THREE.Mesh(
      new THREE.TorusGeometry(.36+r*.17,.015+r*.004,8,64),
      new THREE.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.42-r*.055,blending:THREE.AdditiveBlending,depthWrite:false})
    );
    tor.rotation.x=Math.PI/2;
    tor.position.y=.05+r*.22;
    tor.userData.spin=(r%2?1:-1)*(1.0+r*.28);
    group.add(tor);
  }
  const beacon=new THREE.PointLight(colors[i],9,6,2);
  beacon.position.y=.3; group.add(beacon);
  scene.add(group);
  monuments.push(group);
});

// expanding local vote shockwaves
const shockwaves=[];
function spawnShockwave(k, power=1){
  const m=new THREE.Mesh(
    new THREE.RingGeometry(.25,.29,96),
    new THREE.MeshBasicMaterial({
      color:colors[k],transparent:true,opacity:.8,
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false
    })
  );
  m.position.copy(attractors[k]);
  m.rotation.x=-Math.PI/2;
  m.userData={life:1,power};
  scene.add(m); shockwaves.push(m);
}

// lightning / consensus links between choices
const lightning=[];
[[0,1],[1,2],[2,0]].forEach((pair,idx)=>{
  const geo=new THREE.BufferGeometry();
  const arr=new Float32Array(26*3);
  geo.setAttribute("position",new THREE.BufferAttribute(arr,3));
  const line=new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({
      color:colors[idx],transparent:true,opacity:.18,
      blending:THREE.AdditiveBlending,depthWrite:false
    })
  );
  scene.add(line);
  lightning.push({pair,geo,arr,line,seed:Math.random()*100});
});

// orbital vote stream
const ORBIT_VOTES=1100;
const orbitGeo=new THREE.BufferGeometry();
const orbitPos=new Float32Array(ORBIT_VOTES*3);
const orbitCol=new Float32Array(ORBIT_VOTES*3);
const orbitSeed=[];
for(let i=0;i<ORBIT_VOTES;i++){
  orbitSeed.push({
    a:Math.random()*Math.PI*2,
    r:4.0+Math.random()*2.8,
    tilt:(Math.random()-.5)*1.3,
    speed:.07+Math.random()*.18,
    choice:i%3,
    wobble:Math.random()*Math.PI*2
  });
}
orbitGeo.setAttribute("position",new THREE.BufferAttribute(orbitPos,3));
orbitGeo.setAttribute("color",new THREE.BufferAttribute(orbitCol,3));
const orbitVotes=new THREE.Points(
  orbitGeo,
  new THREE.PointsMaterial({
    size:.045,vertexColors:true,transparent:true,opacity:.72,
    blending:THREE.AdditiveBlending,depthWrite:false
  })
);
scene.add(orbitVotes);

// vertical energy spires above each option
const spires=[];
attractors.forEach((p,i)=>{
  const geo=new THREE.CylinderGeometry(.025,.19,10,12,1,true);
  const mat=new THREE.MeshBasicMaterial({
    color:colors[i],transparent:true,opacity:.07,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false
  });
  const beam=new THREE.Mesh(geo,mat);
  beam.position.copy(p).add(new THREE.Vector3(0,5,0));
  scene.add(beam); spires.push(beam);
});

// tornado-like vote columns
const vortexGroup = new THREE.Group(); scene.add(vortexGroup);
const vortexParticles = [];
const VORTEX_PER=1200;
for(let k=0;k<3;k++){
  const geo=new THREE.BufferGeometry();
  const arr=new Float32Array(VORTEX_PER*3);
  const seed=new Float32Array(VORTEX_PER*4);
  for(let i=0;i<VORTEX_PER;i++){
    seed[i*4]=Math.random();       // height
    seed[i*4+1]=Math.random()*Math.PI*2;
    seed[i*4+2]=Math.random();
    seed[i*4+3]=Math.random();
  }
  geo.setAttribute("position",new THREE.BufferAttribute(arr,3));
  const mat=new THREE.PointsMaterial({
    color:colors[k],size:.055,transparent:true,opacity:.82,
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  const pts=new THREE.Points(geo,mat);
  vortexGroup.add(pts);
  vortexParticles.push({pts,geo,arr,seed,k});
}

// vote rain beams
const MAX=2600;
const beams=[];
const beamGroup=new THREE.Group(); scene.add(beamGroup);
const trailGeo=new THREE.BufferGeometry();
const trailPositions=new Float32Array(MAX*2*3);
const trailColors=new Float32Array(MAX*2*3);
trailGeo.setAttribute("position",new THREE.BufferAttribute(trailPositions,3));
trailGeo.setAttribute("color",new THREE.BufferAttribute(trailColors,3));
trailGeo.setDrawRange(0,MAX*2);
const trailMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false});
const trailLines=new THREE.LineSegments(trailGeo,trailMat);
beamGroup.add(trailLines);

const headGeo=new THREE.BufferGeometry();
const headPos=new Float32Array(MAX*3);
const headCol=new Float32Array(MAX*3);
headGeo.setAttribute("position",new THREE.BufferAttribute(headPos,3));
headGeo.setAttribute("color",new THREE.BufferAttribute(headCol,3));
const headPts=new THREE.Points(headGeo,new THREE.PointsMaterial({size:.075,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
beamGroup.add(headPts);

const counts=[0,0,0], visualMass=[.33,.33,.34];
let targetBias=[.33,.33,.34];

function weightedChoice(){
  const r=Math.random(), a=targetBias[0], b=a+targetBias[1];
  return r<a?0:r<b?1:2;
}
function respawn(i, forced=null){
  const choice=forced ?? weightedChoice();
  const ang=Math.random()*Math.PI*2;
  const radius=1.5+Math.pow(Math.random(),.6)*10.5;
  beams[i]={
    choice,
    start:new THREE.Vector3(Math.cos(ang)*radius,14+Math.random()*14,Math.sin(ang)*radius),
    phase:Math.random()*Math.PI*2,
    speed:.07+Math.random()*.075,
    t:Math.random(),
    wobble:.15+Math.random()*.5
  };
}
for(let i=0;i<MAX;i++) respawn(i);

// D3 easing/scales influence animation
const bendEase=d3.easeCubicInOut;
const fallEase=d3.easeQuadIn;
const vortexScale=d3.scaleSqrt().domain([0,1]).range([.2,1]);

function bezier(a,b,c,t,out){
  const u=1-t;
  out.set(
    u*u*a.x+2*u*t*b.x+t*t*c.x,
    u*u*a.y+2*u*t*b.y+t*t*c.y,
    u*u*a.z+2*u*t*b.z+t*t*c.z
  );
  return out;
}
const p=new THREE.Vector3(), prev=new THREE.Vector3(), mid=new THREE.Vector3();
const ctmp=new THREE.Color();

function updateBeam(i,dt,time){
  const b=beams[i];
  b.t += dt*b.speed;
  if(b.t>1){
    counts[b.choice]++;
    respawn(i);
  }
  const t=Math.min(b.t,1);
  const dest=attractors[b.choice];
  // bend point: mostly vertical initially, then gravity takes over
  mid.copy(b.start).lerp(dest,.48);
  mid.y = 7.5 + 1.7*Math.sin(b.phase);
  mid.x += Math.sin(time*1.6+b.phase)*b.wobble;
  mid.z += Math.cos(time*1.3+b.phase)*b.wobble;

  const eased=bendEase(t);
  bezier(b.start,mid,dest,eased,p);
  const t0=Math.max(0,t-.028);
  bezier(b.start,mid,dest,bendEase(t0),prev);

  // circular gravity swirl near the attractor
  const grav=Math.pow(t,3);
  const ang=b.phase + time*3.4 + t*11;
  const swirl=(1-t)*1.25*grav;
  p.x += Math.cos(ang)*swirl; p.z += Math.sin(ang)*swirl;

  const idx=i*6;
  trailPositions[idx]=prev.x;trailPositions[idx+1]=prev.y;trailPositions[idx+2]=prev.z;
  trailPositions[idx+3]=p.x;trailPositions[idx+4]=p.y;trailPositions[idx+5]=p.z;
  ctmp.setHex(colors[b.choice]);
  for(let j=0;j<2;j++){
    trailColors[idx+j*3]=ctmp.r;trailColors[idx+j*3+1]=ctmp.g;trailColors[idx+j*3+2]=ctmp.b;
  }
  headPos[i*3]=p.x;headPos[i*3+1]=p.y;headPos[i*3+2]=p.z;
  headCol[i*3]=ctmp.r;headCol[i*3+1]=ctmp.g;headCol[i*3+2]=ctmp.b;
}

function updateVortices(time){
  const sum=targetBias.reduce((a,b)=>a+b,0);
  for(let k=0;k<3;k++) visualMass[k]+=(targetBias[k]/sum-visualMass[k])*.025;

  vortexParticles.forEach(v=>{
    const k=v.k, center=attractors[k], strength=vortexScale(visualMass[k]);
    const hMax=8 + visualMass[k]*10;
    for(let i=0;i<VORTEX_PER;i++){
      const h=v.seed[i*4]*hMax;
      const base=v.seed[i*4+1];
      const irregular=.72+.35*Math.sin(base*3.0+time*.45);
      const radius=(.25 + h*.115)*strength*irregular*(.5+v.seed[i*4+2]*.8);
      const a=base + time*(1.8+strength*2.4) + h*.7 + v.seed[i*4+3]*4;
      const ix=i*3;
      v.arr[ix]=center.x+Math.cos(a)*radius;
      v.arr[ix+1]=center.y+h;
      v.arr[ix+2]=center.z+Math.sin(a)*radius;
    }
    v.geo.attributes.position.needsUpdate=true;
    v.pts.material.opacity=.35+.55*strength;
    v.pts.material.size=.035+.045*strength;
  });
}

let pulseKick=0;
let stormBoost=0;

function updateExtras(time,dt){
  relayGroup.children.forEach((g,i)=>{
    const d=g.userData;
    d.a += dt*d.s;
    g.position.set(
      Math.cos(d.a)*d.r,
      Math.sin(d.a*1.7+d.tilt)*1.4,
      Math.sin(d.a)*d.r
    );
    g.rotation.y=-d.a;
    g.rotation.z=d.tilt;
  });

  orbitalRings.rotation.y=time*.035;
  orbitalRings.rotation.x=Math.sin(time*.12)*.08;
  auroraBand.rotation.z=time*.045;

  for(let i=0;i<ORBIT_VOTES;i++){
    const d=orbitSeed[i];
    const a=d.a+time*d.speed;
    const y=Math.sin(a*1.5+d.wobble)*Math.sin(d.tilt)*d.r*.5;
    const rr=d.r*(1+.045*Math.sin(time*.8+d.wobble));
    orbitPos[i*3]=Math.cos(a)*rr;
    orbitPos[i*3+1]=y-.25;
    orbitPos[i*3+2]=Math.sin(a)*rr;
    ctmp.setHex(colors[d.choice]);
    orbitCol[i*3]=ctmp.r; orbitCol[i*3+1]=ctmp.g; orbitCol[i*3+2]=ctmp.b;
  }
  orbitGeo.attributes.position.needsUpdate=true;
  orbitGeo.attributes.color.needsUpdate=true;

  monuments.forEach((g,k)=>{
    g.children.forEach(obj=>{
      if(obj.userData.spin) obj.rotation.z=time*obj.userData.spin;
    });
    const share=visualMass[k];
    g.scale.y=1+share*.32+Math.sin(time*2+k)*.035;
    spires[k].material.opacity=.035+share*.12;
    spires[k].scale.x=.7+share*1.1;
    spires[k].scale.z=.7+share*1.1;
  });

  lightning.forEach((L,li)=>{
    const a=attractors[L.pair[0]], b=attractors[L.pair[1]];
    for(let i=0;i<26;i++){
      const t=i/25;
      const ix=i*3;
      const envelope=Math.sin(Math.PI*t);
      L.arr[ix]=THREE.MathUtils.lerp(a.x,b.x,t)+Math.sin(time*7+i*2.7+L.seed)*.16*envelope;
      L.arr[ix+1]=THREE.MathUtils.lerp(a.y,b.y,t)+1.1*envelope+Math.sin(time*9+i*1.9+L.seed)*.12*envelope;
      L.arr[ix+2]=THREE.MathUtils.lerp(a.z,b.z,t)+Math.cos(time*8+i*3.1+L.seed)*.16*envelope;
    }
    L.geo.attributes.position.needsUpdate=true;
    L.line.material.opacity=.06+.16*(visualMass[L.pair[0]]+visualMass[L.pair[1]]) + stormBoost*.18;
  });

  for(let i=shockwaves.length-1;i>=0;i--){
    const w=shockwaves[i];
    w.userData.life-=dt*(.45/w.userData.power);
    const age=1-w.userData.life;
    const sc=.7+age*(9*w.userData.power);
    w.scale.setScalar(sc);
    w.material.opacity=Math.max(0,w.userData.life)*.55;
    w.rotation.z+=dt*.15;
    if(w.userData.life<=0){
      scene.remove(w); w.geometry.dispose(); w.material.dispose(); shockwaves.splice(i,1);
    }
  }

  pulseKick=Math.max(0,pulseKick-dt*.72);
  stormBoost=Math.max(0,stormBoost-dt*.18);
  const leader=Math.max(...visualMass);
  const heartbeat=Math.pow(Math.max(0,Math.sin(time*3.2)),14);
  const pulse=heartbeat*(.03+leader*.05)+pulseKick*.10;
  pulseShell.scale.setScalar(1+pulse);
  pulseShell.material.opacity=.018+heartbeat*.10+pulseKick*.12;
  atmosphere.material.opacity=.045+heartbeat*.045+stormBoost*.035;
  earth.material.emissiveIntensity=.72+heartbeat*.8+pulseKick*.6;

  if(Math.floor(time*1.25)!==Math.floor((time-dt)*1.25) && Math.random()<.6){
    spawnShockwave(Math.floor(Math.random()*3),.45+.35*Math.random());
  }
}

function updateCounts(){
  // Display scaled population metaphorically as billions
  const total=counts[0]+counts[1]+counts[2]+1;
  const pop=8_000_000_000;
  document.getElementById("aCount").textContent=(pop*counts[0]/total/1e9).toFixed(2)+"B";
  document.getElementById("bCount").textContent=(pop*counts[1]/total/1e9).toFixed(2)+"B";
  document.getElementById("cCount").textContent=(pop*counts[2]/total/1e9).toFixed(2)+"B";
}

document.getElementById("burst").onclick=()=>{
  for(let i=0;i<520;i++){
    const j=Math.floor(Math.random()*MAX);
    beams[j].t=.70+Math.random()*.28;
    beams[j].speed=.20+Math.random()*.26;
  }
  for(let k=0;k<3;k++) spawnShockwave(k,.8);
  pulseKick=.35;
};
document.getElementById("storm").onclick=()=>{
  stormBoost=1;
  pulseKick=.7;
  for(let i=0;i<MAX;i++){
    if(Math.random()<.72){
      beams[i].t=Math.random()*.45;
      beams[i].speed=.18+Math.random()*.34;
    }
  }
  for(let k=0;k<3;k++) {
    spawnShockwave(k,1.1);
    spawnShockwave(k,1.55);
  }
};
document.getElementById("pulse").onclick=()=>{
  pulseKick=1;
  for(let k=0;k<3;k++) spawnShockwave(k,1.7);
};
document.getElementById("rebalance").onclick=()=>{
  const vals=[Math.random()+.15,Math.random()+.15,Math.random()+.15], sum=d3.sum(vals);
  targetBias=vals.map(x=>x/sum);
  for(let i=0;i<MAX;i++) if(Math.random()<.42) respawn(i);
  targetBias.forEach((v,k)=>spawnShockwave(k,.7+v*2));
  pulseKick=.45;
};
document.getElementById("reset").onclick=()=>{
  counts.fill(0);targetBias=[.33,.33,.34];
  visualMass.splice(0,3,.33,.33,.34);
  pulseKick=.25; stormBoost=0;
  for(let i=0;i<MAX;i++) respawn(i);
};

let last=performance.now(), counter=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const time=now/1000;

  for(let i=0;i<MAX;i++) updateBeam(i,dt,time);
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;
  headGeo.attributes.position.needsUpdate=true;
  headGeo.attributes.color.needsUpdate=true;

  updateVortices(time);
  updateExtras(time,dt);
  globe.rotation.y=time*.06;
  wire.rotation.y=-time*.025;
  atmosphere.scale.setScalar(1+.006*Math.sin(time*2)+pulseKick*.012);

  // subtle camera breathing
  scene.rotation.y=Math.sin(time*.12)*.05;
  controls.update();
  renderer.render(scene,camera);

  if((counter++%12)===0) updateCounts();
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
