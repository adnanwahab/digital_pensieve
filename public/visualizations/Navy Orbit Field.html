<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Navy Orbit Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-bleed WebGL canvas, one quiet caption in the corner. Single deliberate dark look. */
  :root {
    --abyss: #02050f;
    --ink: #8ea6d8;
    --ink-dim: #4a5f8f;
    --font-ui: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--abyss); color: var(--ink); overflow: hidden; }
  canvas { display: block; touch-action: none; }
  .cap {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font: 11px/1.6 var(--font-ui);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    pointer-events: none;
    user-select: none;
  }
  .cap b { color: var(--ink); font-weight: 500; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="cap"><b>20 orbits</b> · drag to rotate · scroll to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  // Strokes traced from the sketch (pixel coords on a 1706×1474 canvas)
  const STROKES = [
    // top cap
    [[1070,305],[900,298],[760,282],[670,262],[650,240],[700,210],[850,175],[1000,162],[1150,172],[1290,218],[1375,295],[1400,360],[1380,400],[1300,430],[1100,432],[900,430],[697,425]],
    // long vertical arc
    [[845,462],[880,500],[930,600],[965,720],[978,870],[970,960],[940,1060],[900,1120],[848,1173]],
    // right cap with inner curl
    [[1335,688],[1280,692],[1272,712],[1300,735],[1400,758],[1520,773],[1600,775],[1622,740],[1600,680],[1550,635],[1480,620],[1420,630],[1330,690],[1320,708],[1380,718],[1480,720],[1522,708]],
    // right tail sweeping into the core
    [[1505,758],[1500,790],[1460,840],[1350,920],[1200,990],[1050,1030],[900,1050],[805,1058]],
    // left blob
    [[188,757],[300,738],[400,732],[480,750],[538,795],[520,830],[420,860],[300,872],[180,876],[60,866],[0,838]],
    // left blob inner stroke
    [[0,765],[120,770],[250,788],[340,820],[410,856],[440,870]],
    // left tail into the core
    [[246,855],[300,885],[420,925],[510,945],[600,948],[680,972],[750,1010],[812,1048]],
    // core loop A
    [[490,1010],[540,972],[650,948],[800,925],[900,918],[1000,930],[1040,958],[1000,985],[900,1015],[800,1035],[700,1040],[600,1035],[540,1022],[490,1015]],
    // core loop B
    [[555,1015],[580,990],[680,972],[800,970],[950,985],[1040,1030],[1045,1050],[950,1068],[800,1080],[622,1084]],
    // lower S stem
    [[640,1088],[670,1130],[682,1185],[670,1230],[640,1270],[590,1310],[530,1345],[490,1355]],
    // bottom basin
    [[550,1347],[400,1350],[350,1372],[335,1420],[362,1458],[440,1474],[620,1478],[800,1476],[950,1472],[995,1445],[975,1418],[900,1380],[780,1340],[648,1316]],
  ];

  const toWorld = ([x, y], i, k) => new THREE.Vector3(
    (x - 830) / 95,
    -(y - 820) / 95,
    Math.sin(i * 1.7 + k * 0.45) * 0.9 + Math.cos(k * 0.3 + i) * 0.4
  );

  // Base curves + echo shells to make 20 orbits
  const curves = [];
  STROKES.forEach((s, i) => {
    curves.push(new THREE.CatmullRomCurve3(s.map((p, k) => toWorld(p, i, k)), false, 'centripetal'));
  });
  const echoes = [0, 1, 2, 4, 7, 8, 10, 3, 6]; // 9 echoes → 20 total
  echoes.forEach((src, j) => {
    const base = STROKES[src];
    const s = 1.035 + j * 0.006, dz = (j % 2 ? 1 : -1) * (0.7 + j * 0.08);
    curves.push(new THREE.CatmullRomCurve3(base.map((p, k) => {
      const v = toWorld(p, src, k);
      v.x *= s; v.y = v.y * s - 0.08 * (j % 3 - 1); v.z += dz;
      return v;
    }), false, 'centripetal'));
  });

  // Arc-length lookup tables
  const SAMPLES = 600;
  const tables = curves.map(c => c.getSpacedPoints(SAMPLES - 1));
  const lengths = curves.map(c => c.getLength());

  // Scene
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x02050f, 1);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x02050f, 0.025);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
  const fit = () => { camera.position.set(0, 0, innerWidth < 600 ? 30 : 21); };
  fit();

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 8;
  controls.maxDistance = 60;
  controls.enablePan = false;

  const group = new THREE.Group();
  scene.add(group);

  // Faint guide lines for each orbit
  curves.forEach((c, i) => {
    const g = new THREE.BufferGeometry().setFromPoints(tables[i]);
    const m = new THREE.LineBasicMaterial({ color: 0x1b3a8c, transparent: true, opacity: i < STROKES.length ? 0.28 : 0.12, blending: THREE.AdditiveBlending, depthWrite: false });
    group.add(new THREE.Line(g, m));
  });

  // Particles
  const PER = innerWidth < 600 ? 380 : 650;
  const N = curves.length * PER;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const size = new Float32Array(N);
  const alpha = new Float32Array(N);
  const meta = []; // {c, u, speed, jx, jy, jz}

  const navy = [new THREE.Color(0x1a2f7a), new THREE.Color(0x2546b8), new THREE.Color(0x3d6ae0), new THREE.Color(0x7fa4ff)];
  for (let c = 0; c < curves.length; c++) {
    const lenScale = 12 / lengths[c];
    for (let k = 0; k < PER; k++) {
      const n = c * PER + k;
      const r = Math.random();
      const pick = r < 0.45 ? 0 : r < 0.8 ? 1 : r < 0.97 ? 2 : 3;
      const cc = navy[pick];
      col.set([cc.r, cc.g, cc.b], n * 3);
      size[n] = pick === 3 ? 2.6 + Math.random() * 1.6 : 1.2 + Math.random() * 2.2;
      const spread = 0.06 + Math.pow(Math.random(), 3) * 0.45;
      meta.push({
        c, u: Math.random(),
        speed: (0.018 + Math.random() * 0.03) * lenScale * (c % 2 ? 1 : 1.15),
        jx: (Math.random() - 0.5) * spread, jy: (Math.random() - 0.5) * spread, jz: (Math.random() - 0.5) * spread,
        ph: Math.random() * Math.PI * 2,
      });
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uPR: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha;
      varying vec3 vCol; varying float vA;
      uniform float uPR;
      void main() {
        vCol = color; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPR * (22.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vCol; varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float core = smoothstep(0.5, 0.0, d);
        float glow = pow(core, 2.2);
        gl_FragColor = vec4(vCol * (0.55 + glow * 1.4), glow * vA);
      }`,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  group.add(new THREE.Points(geo, mat));

  // Distant dust
  const dustN = 1400, dust = new Float32Array(dustN * 3);
  for (let i = 0; i < dustN; i++) {
    const r = 20 + Math.random() * 40, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    dust.set([r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p)], i * 3);
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(dust, 3));
  scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: 0x1c2f66, size: 0.12, transparent: true, opacity: 0.6, depthWrite: false })));

  // Bloom
  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.35, 0.75, 0.0);
  composer.addPass(bloom);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock = new THREE.Clock();
  const tmp = new THREE.Vector3();

  function step(dt, t) {
    for (let n = 0; n < N; n++) {
      const m = meta[n];
      m.u += m.speed * dt;
      if (m.u >= 1) m.u -= 1;
      const tab = tables[m.c];
      const f = m.u * (SAMPLES - 1), i0 = f | 0, i1 = Math.min(i0 + 1, SAMPLES - 1), w = f - i0;
      const a = tab[i0], b = tab[i1];
      const wob = Math.sin(t * 1.3 + m.ph) * 0.35 + 1;
      pos[n * 3]     = a.x + (b.x - a.x) * w + m.jx * wob;
      pos[n * 3 + 1] = a.y + (b.y - a.y) * w + m.jy * wob;
      pos[n * 3 + 2] = a.z + (b.z - a.z) * w + m.jz * wob;
      // fade in at stroke start, fade out at stroke end
      alpha[n] = Math.min(1, m.u * 8, (1 - m.u) * 8) * (0.7 + 0.3 * Math.sin(t * 2 + m.ph));
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.aAlpha.needsUpdate = true;
  }

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    step(reduce ? 0 : dt, reduce ? 0 : t);
    if (!reduce) group.rotation.y = Math.sin(t * 0.08) * 0.35;
    controls.update();
    composer.render();
    requestAnimationFrame(frame);
  }
  step(0, 0);
  frame();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
})();
</script>

</body></html>
