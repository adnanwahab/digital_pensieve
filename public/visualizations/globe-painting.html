<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thousand Arrow Painting</title>
<style>
:root{--bg:#fafaf8;--text:#1f1e1d;--muted:#6b6a66;--card:#f0efeb;--border:rgba(0,0,0,0.15);--accent:#2f6fd0;--sphere:#e6ebf1;--land:#c4ccd6;--grat:rgba(0,0,0,0.06);--edge:rgba(0,0,0,0.2);--frame:#f1f3f6;--grid:rgba(0,0,0,0.05);--flash:rgba(0,0,0,0.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1a19;--text:#ecebe6;--muted:#a3a29c;--card:#252523;--border:rgba(255,255,255,0.18);--accent:#7fb0f0;--sphere:#161a22;--land:#343a46;--grat:rgba(255,255,255,0.06);--edge:rgba(255,255,255,0.25);--frame:#1c1f26;--grid:rgba(255,255,255,0.05);--flash:rgba(255,255,255,0.8)}}
:root[data-theme="dark"]{--bg:#1a1a19;--text:#ecebe6;--muted:#a3a29c;--card:#252523;--border:rgba(255,255,255,0.18);--accent:#7fb0f0;--sphere:#161a22;--land:#343a46;--grat:rgba(255,255,255,0.06);--edge:rgba(255,255,255,0.25);--frame:#1c1f26;--grid:rgba(255,255,255,0.05);--flash:rgba(255,255,255,0.8)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px;min-height:34px;font-size:14px;color:var(--muted)}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:0.5px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--card)}
#send{border-color:var(--accent);color:var(--accent)}
[hidden]{display:none!important}
#wrap{position:relative;width:100%;aspect-ratio:2/1}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
</style>
</head>
<body>
<main>
<h1>A thousand arrows, one painting</h1>
<p class="sub">Each arrow leaves a city on the globe and paints a 10×10 block of 100 pixels. Drag the globe to spin it.</p>
<div class="bar">
<button id="rs">Restart</button>
<button id="send" hidden>Send it back to everyone</button>
<span id="status"></span>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function(){
const COLS=40,ROWS=25,BS=10,PW=COLS*BS,PH=ROWS*BS,M=COLS*ROWS,RATE=50,FLY=1.6,PAINT=0.5,END=M/RATE,DONE=END+FLY+PAINT;
const RRATE=250,RFLY=1.8,PULSE=0.8,RDONE=M/RRATE+RFLY+PULSE;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function px(u,v){let r,g,b;
 const h1=0.62+0.06*Math.sin(u*7+1)+0.03*Math.sin(u*19),h2=0.72+0.05*Math.sin(u*5+3)+0.02*Math.sin(u*23+1),sd=Math.hypot(u-0.66,(v-0.5)*1.1*0.625);
 if(v<h1){const t=v/h1;r=40+200*t;g=50+90*t;b=120-10*t;if(sd<0.07){r=255;g=220;b=150}else if(sd<0.13){const k=1-(sd-0.07)/0.06;r+=k*60;g+=k*50;b+=k*20;}
  const cl=Math.sin(u*9+v*30)*Math.sin(u*3-v*14);if(v<0.35&&cl>0.6){r+=30;g+=25;b+=30;}}
 else if(v<h2){const t=(v-h1)/0.12;r=70-20*t;g=60+10*t;b=90-10*t;}
 else if(v<0.82){r=40;g=80+9*Math.sin(u*40);b=60;}
 else{const t=(v-0.82)/0.18,ref=Math.exp(-((u-0.66)**2)*60)*(0.5+0.5*Math.sin(v*120+u*20));r=30+120*ref*(1-t);g=60+80*ref*(1-t);b=110+40*ref;}
 return[r,g,b];}
const blocks=[];
for(let by=0;by<ROWS;by++)for(let bx=0;bx<COLS;bx++){let r=0,g=0,b=0;
 for(let sy=0;sy<4;sy++)for(let sx=0;sx<4;sx++){const c=px((bx*BS+(sx+0.5)*BS/4)/PW,(by*BS+(sy+0.5)*BS/4)/PH);r+=c[0];g+=c[1];b+=c[2];}
 blocks.push({bx,by,col:[r/16,g/16,b/16].map(x=>Math.round(Math.max(0,Math.min(255,x))))});}
const cities=[['Houston',-95.4,29.8],['Lagos',3.4,6.5],['Mumbai',72.9,19.1],['São Paulo',-46.6,-23.5],['Tokyo',139.7,35.7],['Cairo',31.2,30],['London',-0.1,51.5],['Mexico City',-99.1,19.4],['Jakarta',106.8,-6.2],['Sydney',151.2,-33.9],['Nairobi',36.8,-1.3],['Seoul',127,37.6],['Lima',-77,-12],['Istanbul',29,41],['Dhaka',90.4,23.8],['Toronto',-79.4,43.7],['Berlin',13.4,52.5],['Manila',121,14.6],['Buenos Aires',-58.4,-34.6],['Karachi',67,24.9],['Kinshasa',15.3,-4.3],['Bogotá',-74.1,4.7],['Tehran',51.4,35.7],['Moscow',37.6,55.8],['Johannesburg',28,-26.2],['Bangkok',100.5,13.8],['Reykjavík',-21.9,64.1],['Anchorage',-149.9,61.2],['Honolulu',-157.9,21.3],['Auckland',174.8,-36.8],['Addis Ababa',38.7,9],['Hanoi',105.8,21],['Santiago',-70.7,-33.4],['Casablanca',-7.6,33.6],['Ulaanbaatar',106.9,47.9],['Vancouver',-123.1,49.3],['Dakar',-17.4,14.7],['Lisbon',-9.1,38.7],['Perth',115.9,-32],['Kathmandu',85.3,27.7]];
const pord=d3.shuffle(d3.range(BS*BS));
const off=document.createElement('canvas');off.width=PW;off.height=PH;const octx=off.getContext('2d'),img=octx.createImageData(PW,PH),d=img.data;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap'),dpr=window.devicePixelRatio||1;
const sendBtn=document.getElementById('send'),status=document.getElementById('status');
let W=1,H=1;function size(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(size).observe(wrap);size();
const proj=d3.geoOrthographic().clipAngle(90).rotate([30,-15]),path=d3.geoPath(proj,ctx),grat=d3.geoGraticule10();
let land=null;fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(r=>r.json()).then(t=>{land=topojson.feature(t,t.objects.land);}).catch(()=>{});
let trips=[],simT=0,retT=0,phase='paint',last=performance.now(),spin=true,drag=null;
function reset(){const ord=d3.shuffle(d3.range(M));trips=ord.map((b,k)=>({b,k,launch:k/RATE,org:null,arc:Math.random(),done:0}));
 d.fill(0);octx.putImageData(img,0,0);simT=0;retT=0;phase='paint';sendBtn.hidden=true;status.textContent='Painting…';}
function center(){const r=proj.rotate();return[-r[0],-r[1]];}
function pickOrigin(){const c=center(),vis=cities.filter(x=>d3.geoDistance([x[1],x[2]],c)<Math.PI/2-0.25),pool=vis.length?vis:cities,x=pool[(Math.random()*pool.length)|0];
 return[x[1]+(Math.random()-0.5)*6,x[2]+(Math.random()-0.5)*4];}
sendBtn.onclick=()=>{const ord=d3.shuffle(d3.range(M));ord.forEach((ti,j)=>{const tr=trips[ti];tr.rl=j/RRATE;tr.sx=Math.random();tr.sy=Math.random();tr.rarc=Math.random();});
 retT=0;phase='return';sendBtn.hidden=true;status.textContent='Sending it back…';};
function arrowTo(x0,y0,x1,y1,arc,t,col,headFn){
 const mx=(x0+x1)/2,my=Math.max(8,Math.min(y0,y1)-40-arc*70);
 const bz=s=>{const a=1-s;return[a*a*x0+2*a*s*mx+s*s*x1,a*a*y0+2*a*s*my+s*s*y1];};
 const p=bz(t),s0=Math.max(0,t-0.18);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();const tl=bz(s0);ctx.moveTo(tl[0],tl[1]);
 for(let s=s0;s<t;s+=0.03){const q=bz(s);ctx.lineTo(q[0],q[1]);}ctx.lineTo(p[0],p[1]);ctx.stroke();
 const pr=bz(Math.max(0,t-0.02));headFn(p,Math.atan2(p[1]-pr[1],p[0]-pr[0]));}
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;
 if(phase==='paint'){simT+=dt;if(simT>=DONE){simT=DONE;phase='done';sendBtn.hidden=false;status.textContent='The painting is complete.';}}
 if(phase==='return'){retT+=dt;if(retT>=RDONE){phase='delivered';status.textContent='Delivered back to all 1,000 painters.';}}
 if(spin&&!drag){const r=proj.rotate();proj.rotate([r[0]+dt*8,r[1]]);}
 const gr=Math.min(W*0.22,H*0.44),gcx=W*0.245,gcy=H/2;proj.scale(gr).translate([gcx,gcy]);
 const pw=W*0.46,ph=pw*PH/PW,pxo=W*0.525,pyo=(H-ph)/2;
 let dirty=false;
 for(const tr of trips){const tl=simT-tr.launch-FLY;if(tl<0)continue;const want=Math.min(100,Math.floor(Math.max(0,tl)/PAINT*100)+1);
  if(want>tr.done){const bl=blocks[tr.b];for(let j=tr.done;j<want;j++){const p=pord[j],x=bl.bx*BS+p%BS,y=bl.by*BS+((p/BS)|0),q=(y*PW+x)*4,jit=((p*37)%9)-4;
    d[q]=Math.max(0,Math.min(255,bl.col[0]+jit));d[q+1]=Math.max(0,Math.min(255,bl.col[1]+jit));d[q+2]=Math.max(0,Math.min(255,bl.col[2]+jit));d[q+3]=255;}
   tr.done=want;dirty=true;}}
 if(dirty)octx.putImageData(img,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=css('--sphere');ctx.fill();
 ctx.beginPath();path(grat);ctx.strokeStyle=css('--grat');ctx.lineWidth=0.5;ctx.stroke();
 if(land){ctx.beginPath();path(land);ctx.fillStyle=css('--land');ctx.fill();}
 ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle=css('--edge');ctx.lineWidth=0.75;ctx.stroke();
 const cen=center();ctx.fillStyle='#f2c14e';
 for(const c of cities){if(d3.geoDistance([c[1],c[2]],cen)>Math.PI/2)continue;const p=proj([c[1],c[2]]);ctx.beginPath();ctx.arc(p[0],p[1],2,0,7);ctx.fill();}
 if(phase==='return'||phase==='delivered'){for(const tr of trips){if(retT<tr.rl+RFLY||d3.geoDistance(tr.org,cen)>Math.PI/2)continue;const o=proj(tr.org);
   ctx.globalAlpha=0.85;ctx.drawImage(off,o[0]-4,o[1]-2.5,8,5);ctx.globalAlpha=1;}}
 ctx.fillStyle=css('--frame');ctx.fillRect(pxo,pyo,pw,ph);
 ctx.strokeStyle=css('--grid');ctx.lineWidth=0.5;ctx.beginPath();
 for(let i=1;i<COLS;i++){const x=pxo+i*pw/COLS;ctx.moveTo(x,pyo);ctx.lineTo(x,pyo+ph);}for(let j=1;j<ROWS;j++){const y=pyo+j*ph/ROWS;ctx.moveTo(pxo,y);ctx.lineTo(pxo+pw,y);}ctx.stroke();
 ctx.imageSmoothingEnabled=false;ctx.drawImage(off,pxo,pyo,pw,ph);
 ctx.strokeStyle=css('--edge');ctx.strokeRect(pxo,pyo,pw,ph);
 ctx.lineCap='round';
 if(phase==='paint'){
  for(const tr of trips){const t=(simT-tr.launch)/FLY;if(t<0||t>1)continue;
   if(!tr.org)tr.org=pickOrigin();const o=proj(tr.org);
   const bl=blocks[tr.b],col=`rgb(${bl.col[0]},${bl.col[1]},${bl.col[2]})`;ctx.globalAlpha=0.9;
   arrowTo(o[0],o[1],pxo+(bl.bx+0.5)*pw/COLS,pyo+(bl.by+0.5)*ph/ROWS,tr.arc,t,col,(p,an)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0],p[1]);
    ctx.lineTo(p[0]-8*Math.cos(an-0.45),p[1]-8*Math.sin(an-0.45));ctx.lineTo(p[0]-8*Math.cos(an+0.45),p[1]-8*Math.sin(an+0.45));ctx.closePath();ctx.fill();});
   ctx.globalAlpha=1;ctx.fillStyle=col;ctx.beginPath();ctx.arc(o[0],o[1],3,0,7);ctx.fill();}
  for(const tr of trips){const tl=simT-tr.launch-FLY;if(tl<0||tl>PAINT)continue;const bl=blocks[tr.b];
   ctx.strokeStyle=css('--flash');ctx.lineWidth=1;ctx.globalAlpha=1-tl/PAINT;
   ctx.strokeRect(pxo+bl.bx*pw/COLS,pyo+bl.by*ph/ROWS,pw/COLS,ph/ROWS);ctx.globalAlpha=1;}}
 if(phase==='return'){
  for(const tr of trips){const t=(retT-tr.rl)/RFLY;if(t<0)continue;const o=proj(tr.org),hidden=d3.geoDistance(tr.org,cen)>Math.PI/2;
   if(t<=1){const bl=blocks[tr.b],col=`rgb(${bl.col[0]},${bl.col[1]},${bl.col[2]})`;
    ctx.globalAlpha=hidden?0.9*(1-t):0.9;
    arrowTo(pxo+(0.2+tr.sx*0.6)*pw,pyo+(0.2+tr.sy*0.6)*ph,o[0],o[1],tr.rarc,t,col,(p,an)=>{
     ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(an*0.15);ctx.drawImage(off,-9,-5.6,18,11.25);ctx.strokeStyle=css('--edge');ctx.lineWidth=0.75;ctx.strokeRect(-9,-5.6,18,11.25);ctx.restore();});
    ctx.globalAlpha=1;}
   else if(!hidden&&t*RFLY-RFLY<PULSE){const a=(t*RFLY-RFLY)/PULSE;ctx.strokeStyle='#f2c14e';ctx.lineWidth=1.5;ctx.globalAlpha=1-a;ctx.beginPath();ctx.arc(o[0],o[1],4+a*14,0,7);ctx.stroke();ctx.globalAlpha=1;}}}
 requestAnimationFrame(frame);}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();if(e.clientX-r.left>W*0.5)return;drag={x:e.clientX,y:e.clientY,r:proj.rotate()};cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;proj.rotate([drag.r[0]+(e.clientX-drag.x)*0.4,Math.max(-80,Math.min(80,drag.r[1]-(e.clientY-drag.y)*0.4))]);});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab';spin=false;setTimeout(()=>{if(!drag)spin=true;},2500);});
document.getElementById('rs').onclick=reset;
reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
